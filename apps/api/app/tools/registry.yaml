tools:
  - name: rag_search
    display_name: RAG Search
    category: retrieval
    description: Search indexed project document chunks.
    risk_level: low
    requires_approval: false
    timeout_seconds: 10
    input_schema:
      type: object
      properties:
        query:
          type: string
        top_k:
          type: integer

  - name: memory_search
    display_name: Memory Search
    category: retrieval
    description: Search active project memories.
    risk_level: low
    requires_approval: false
    timeout_seconds: 10
    input_schema:
      type: object
      properties:
        query:
          type: string
        top_k:
          type: integer

  - name: output_writer
    display_name: Output Writer
    category: generation
    description: Persist an agent-generated output artifact.
    risk_level: low
    requires_approval: false
    timeout_seconds: 30
    input_schema:
      type: object
      properties:
        skill:
          type: string
        output_type:
          type: string
        title:
          type: string
        content:
          type: string

  - name: file_reader
    display_name: File Reader
    category: file
    description: Read from an allowed document source.
    risk_level: medium
    requires_approval: false
    timeout_seconds: 30

  - name: file_writer
    display_name: File Writer
    category: file
    description: Write to the local file system.
    risk_level: high
    requires_approval: true
    timeout_seconds: 30

  - name: web_search
    display_name: Web Search
    category: retrieval
    description: Search external web sources.
    risk_level: medium
    requires_approval: false
    timeout_seconds: 20

  - name: social_trend_scan
    display_name: Social Trend Scan
    category: retrieval
    description: Build a social trend scan scaffold from known platform signals.
    risk_level: medium
    requires_approval: false
    timeout_seconds: 30

  - name: code_executor
    display_name: Code Executor
    category: execution
    description: Execute code snippets.
    risk_level: high
    requires_approval: true
    timeout_seconds: 60

  - name: database_write
    display_name: Database Write
    category: database
    description: Write directly to the database.
    risk_level: high
    requires_approval: true
    timeout_seconds: 30

  - name: embedding_generator
    display_name: Embedding Generator
    category: ai
    description: Generate text embeddings.
    risk_level: low
    requires_approval: false
    timeout_seconds: 15

  - name: code_analyzer
    display_name: Code Analyzer
    category: analysis
    description: Analyze code structure and quality.
    risk_level: low
    requires_approval: false
    timeout_seconds: 30

  - name: pdf_parser
    display_name: PDF Parser
    category: parsing
    description: Parse PDF document content.
    risk_level: low
    requires_approval: false
    timeout_seconds: 30

  - name: document_reader
    display_name: Document Reader
    category: file
    description: Read project document content.
    risk_level: low
    requires_approval: false
    timeout_seconds: 15
